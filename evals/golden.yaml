# Questions with a hand-written reference query. The agent never sees this file.
- {id: rev-total-2025, topic: revenue, question: "What was total net revenue in 2025?", sql: "SELECT SUM(net_revenue) FROM analytics.fct_sales WHERE year(order_date)=2025"}
- {id: rev-channel-2026, topic: revenue, question: "Net revenue by channel in 2026", sql: "SELECT channel, SUM(net_revenue) FROM analytics.fct_sales WHERE year(order_date)=2026 GROUP BY 1"}
- {id: rev-region-lq, topic: revenue, question: "What was net revenue by region last quarter?", sql: "SELECT s.region, SUM(f.net_revenue) FROM analytics.fct_sales f JOIN analytics.dim_store s USING (store_id) WHERE f.order_date BETWEEN DATE '2026-07-01' AND DATE '2026-09-30' GROUP BY 1"}
- {id: rev-monthly-2026, topic: revenue, ordered: true, question: "Show monthly net revenue in 2026, oldest month first", sql: "SELECT date_trunc('month', order_date) m, SUM(net_revenue) FROM analytics.fct_sales WHERE year(order_date)=2026 GROUP BY 1 ORDER BY 1"}
- {id: rev-yoy-q3, topic: revenue, question: "What was net revenue in Q3 2025 and in Q3 2026? Give one row per year.", sql: "SELECT year(order_date), SUM(net_revenue) FROM analytics.fct_sales WHERE month(order_date) BETWEEN 7 AND 9 GROUP BY 1"}
- {id: rev-gross-dec, topic: revenue, question: "What was gross revenue in December 2025?", sql: "SELECT SUM(gross_revenue) FROM analytics.fct_sales WHERE order_date BETWEEN DATE '2025-12-01' AND DATE '2025-12-31'"}
- {id: mar-category, topic: margin, question: "Gross margin percentage by product category in 2026", sql: "SELECT p.category, SUM(gross_margin)/SUM(net_revenue)*100 FROM analytics.fct_sales f JOIN analytics.dim_product p USING (product_id) WHERE year(order_date)=2026 GROUP BY 1"}
- {id: mar-top-brands, topic: margin, ordered: true, question: "Top 3 brands by gross margin dollars in 2026", sql: "SELECT p.brand, SUM(gross_margin) g FROM analytics.fct_sales f JOIN analytics.dim_product p USING (product_id) WHERE year(order_date)=2026 GROUP BY 1 ORDER BY g DESC LIMIT 3"}
- {id: mar-discount, topic: margin, question: "What was the discount rate in November and December 2025 combined?", sql: "SELECT SUM(discount_amount)/SUM(gross_revenue)*100 FROM analytics.fct_sales WHERE order_date BETWEEN DATE '2025-11-01' AND DATE '2025-12-31'"}
- {id: ord-count, topic: orders, question: "How many orders were placed in September 2026?", sql: "SELECT COUNT(DISTINCT order_id) FROM analytics.fct_sales WHERE order_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'"}
- {id: ord-aov-channel, topic: orders, question: "Average order value by channel in 2026", sql: "SELECT channel, SUM(net_revenue)/COUNT(DISTINCT order_id) FROM analytics.fct_sales WHERE year(order_date)=2026 GROUP BY 1"}
- {id: ord-return-channel, topic: orders, question: "Compare return rate by channel across all time", sql: "SELECT channel, AVG(CASE WHEN is_returned THEN 1.0 ELSE 0 END)*100 FROM analytics.fct_sales GROUP BY 1"}
- {id: ord-units, topic: orders, question: "How many units were sold in 2025, excluding returns?", sql: "SELECT SUM(quantity) FILTER (WHERE NOT is_returned) FROM analytics.fct_sales WHERE year(order_date)=2025"}
- {id: ord-bopis-share, topic: orders, question: "What percentage of 2026 orders were buy online pick up in store?", sql: "SELECT COUNT(DISTINCT order_id) FILTER (WHERE channel='bopis')*100.0/COUNT(DISTINCT order_id) FROM analytics.fct_sales WHERE year(order_date)=2026"}
- {id: cus-segment, topic: customers, question: "How many customers are in each segment?", sql: "SELECT segment, COUNT(*) FROM analytics.dim_customer GROUP BY 1"}
- {id: cus-tier-aov, topic: customers, question: "Average order value by loyalty tier in 2026", sql: "SELECT c.loyalty_tier, SUM(net_revenue)/COUNT(DISTINCT order_id) FROM analytics.fct_sales f JOIN analytics.dim_customer c USING (customer_id) WHERE year(order_date)=2026 GROUP BY 1"}
- {id: cus-active, topic: customers, question: "How many active customers bought something in Q3 2026?", sql: "SELECT COUNT(DISTINCT customer_id) FROM analytics.fct_sales WHERE order_date BETWEEN DATE '2026-07-01' AND DATE '2026-09-30'"}
- {id: cus-top-state, topic: customers, ordered: true, question: "Which 5 customer states generated the most net revenue overall?", sql: "SELECT c.state, SUM(net_revenue) r FROM analytics.fct_sales f JOIN analytics.dim_customer c USING (customer_id) GROUP BY 1 ORDER BY r DESC LIMIT 5"}
- {id: cus-repeat, topic: customers, question: "How many customers placed more than 10 orders in total?", sql: "SELECT COUNT(*) FROM (SELECT customer_id FROM analytics.fct_sales GROUP BY 1 HAVING COUNT(DISTINCT order_id) > 10)"}
- {id: cus-signups, topic: customers, question: "How many customers signed up in 2025?", sql: "SELECT COUNT(*) FROM analytics.dim_customer WHERE year(signup_date)=2025"}
- {id: sto-top, topic: stores, ordered: true, question: "Top 5 stores by net revenue in 2026", sql: "SELECT s.store_name, SUM(net_revenue) r FROM analytics.fct_sales f JOIN analytics.dim_store s USING (store_id) WHERE year(order_date)=2026 GROUP BY 1 ORDER BY r DESC LIMIT 5"}
- {id: sto-format, topic: stores, question: "How many stores are there of each format?", sql: "SELECT store_format, COUNT(*) FROM analytics.dim_store GROUP BY 1"}
- {id: sto-per-store, topic: stores, question: "Average net revenue per store in each region for 2025", sql: "SELECT s.region, SUM(net_revenue)/COUNT(DISTINCT store_id) FROM analytics.fct_sales f JOIN analytics.dim_store s USING (store_id) WHERE year(order_date)=2025 GROUP BY 1"}
- {id: inv-latest-units, topic: inventory, question: "How many units are on hand right now?", sql: "SELECT SUM(on_hand_units) FROM analytics.fct_inventory WHERE snapshot_month=(SELECT MAX(snapshot_month) FROM analytics.fct_inventory)"}
- {id: inv-below, topic: inventory, question: "How many store and product combinations are below their reorder point in the latest snapshot?", sql: "SELECT COUNT(*) FROM analytics.fct_inventory WHERE snapshot_month=(SELECT MAX(snapshot_month) FROM analytics.fct_inventory) AND on_hand_units < reorder_point"}
- {id: inv-category, topic: inventory, question: "Units on hand by product category in June 2026", sql: "SELECT p.category, SUM(on_hand_units) FROM analytics.fct_inventory i JOIN analytics.dim_product p USING (product_id) WHERE snapshot_month=DATE '2026-06-01' GROUP BY 1"}
- {id: inv-value, topic: inventory, question: "What is the value at cost of current inventory by region?", sql: "SELECT s.region, SUM(i.on_hand_units*p.unit_cost) FROM analytics.fct_inventory i JOIN analytics.dim_product p USING (product_id) JOIN analytics.dim_store s USING (store_id) WHERE snapshot_month=(SELECT MAX(snapshot_month) FROM analytics.fct_inventory) GROUP BY 1"}
- {id: mkt-roas, topic: marketing, question: "Return on ad spend by marketing channel in 2026", sql: "SELECT marketing_channel, SUM(attributed_revenue)/SUM(spend) FROM analytics.fct_marketing WHERE year(week_start)=2026 GROUP BY 1"}
- {id: mkt-spend-q4, topic: marketing, question: "Total marketing spend in Q4 2025", sql: "SELECT SUM(spend) FROM analytics.fct_marketing WHERE week_start BETWEEN DATE '2025-10-01' AND DATE '2025-12-31'"}
- {id: mkt-best-week, topic: marketing, ordered: true, question: "Which week and channel had the single highest marketing spend?", sql: "SELECT week_start, marketing_channel FROM analytics.fct_marketing ORDER BY spend DESC LIMIT 1"}
