# Questions with a hand-written reference query. The agent never sees this file.
- {id: rev-total-2025, topic: company, question: "What was total company net revenue in 2025, retail and wholesale combined?", sql: "SELECT SUM(net_revenue) FROM analytics.fct_channel_sales WHERE year(sale_date)=2025"}
- {id: rev-business-2026, topic: company, question: "Compare net revenue for retail and wholesale in 2026", sql: "SELECT business, SUM(net_revenue) FROM analytics.fct_channel_sales WHERE year(sale_date)=2026 GROUP BY 1"}
- {id: mar-business-q3, topic: company, question: "Gross margin percentage for retail versus wholesale last quarter", sql: "SELECT business, SUM(gross_margin)/SUM(net_revenue)*100 FROM analytics.fct_channel_sales WHERE sale_date BETWEEN DATE '2026-07-01' AND DATE '2026-09-30' GROUP BY 1"}
- {id: rev-monthly-2026, topic: company, ordered: true, question: "Show monthly company net revenue in 2026, oldest month first", sql: "SELECT date_trunc('month', sale_date) m, SUM(net_revenue) FROM analytics.fct_channel_sales WHERE year(sale_date)=2026 GROUP BY 1 ORDER BY 1"}
- {id: rev-brand-2026, topic: company, ordered: true, question: "Top 3 brands by total gross margin dollars in 2026 across retail and wholesale", sql: "SELECT p.brand, SUM(gross_margin) g FROM analytics.fct_channel_sales f JOIN analytics.dim_product p USING (product_id) WHERE year(sale_date)=2026 GROUP BY 1 ORDER BY g DESC LIMIT 3"}
- {id: ret-channel-2026, topic: retail, question: "Retail net revenue by channel in 2026", sql: "SELECT channel, SUM(net_revenue) FROM analytics.fct_sales WHERE year(order_date)=2026 GROUP BY 1"}
- {id: ret-region-lq, topic: retail, question: "What was retail net revenue by region last quarter?", sql: "SELECT s.region, SUM(f.net_revenue) FROM analytics.fct_sales f JOIN analytics.dim_store s USING (store_id) WHERE f.order_date BETWEEN DATE '2026-07-01' AND DATE '2026-09-30' GROUP BY 1"}
- {id: ret-orders, topic: retail, question: "How many retail orders were placed in September 2026?", sql: "SELECT COUNT(DISTINCT order_id) FROM analytics.fct_sales WHERE order_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'"}
- {id: ret-aov-channel, topic: retail, question: "Average order value by channel in 2026", sql: "SELECT channel, SUM(net_revenue)/COUNT(DISTINCT order_id) FROM analytics.fct_sales WHERE year(order_date)=2026 GROUP BY 1"}
- {id: ret-return-category, topic: retail, question: "Compare return rate by product category across all time", sql: "SELECT p.category, AVG(CASE WHEN is_returned THEN 1.0 ELSE 0 END)*100 FROM analytics.fct_sales f JOIN analytics.dim_product p USING (product_id) GROUP BY 1"}
- {id: ret-discount, topic: retail, question: "What was the retail discount rate in November and December 2025 combined?", sql: "SELECT SUM(discount_amount)/SUM(gross_revenue)*100 FROM analytics.fct_sales WHERE order_date BETWEEN DATE '2025-11-01' AND DATE '2025-12-31'"}
- {id: ret-top-stores, topic: retail, ordered: true, question: "Top 5 stores by net revenue in 2026", sql: "SELECT s.store_name, SUM(net_revenue) r FROM analytics.fct_sales f JOIN analytics.dim_store s USING (store_id) WHERE year(order_date)=2026 GROUP BY 1 ORDER BY r DESC LIMIT 5"}
- {id: ret-top-sizes, topic: retail, ordered: true, question: "Which 3 men's shoe sizes sold the most pairs at retail in 2026, excluding returns?", sql: "SELECT f.size, SUM(quantity) u FROM analytics.fct_sales f JOIN analytics.dim_product p USING (product_id) WHERE p.gender='Men' AND NOT is_returned AND year(order_date)=2026 GROUP BY 1 ORDER BY u DESC LIMIT 3"}
- {id: ws-top-accounts, topic: wholesale, ordered: true, question: "Which 5 wholesale accounts had the highest net revenue in 2026?", sql: "SELECT a.account_name, SUM(net_revenue) r FROM analytics.fct_wholesale w JOIN analytics.dim_account a USING (account_id) WHERE year(ship_date)=2026 GROUP BY 1 ORDER BY r DESC LIMIT 5"}
- {id: ws-type, topic: wholesale, question: "Wholesale net revenue and gross margin percentage by account type in 2026", sql: "SELECT a.account_type, SUM(net_revenue), SUM(gross_margin)/SUM(net_revenue)*100 FROM analytics.fct_wholesale w JOIN analytics.dim_account a USING (account_id) WHERE year(ship_date)=2026 GROUP BY 1"}
- {id: ws-fill-month, topic: wholesale, ordered: true, question: "What was the wholesale fill rate by ship month in 2026, oldest first?", sql: "SELECT date_trunc('month', ship_date) m, SUM(units_shipped)*100.0/SUM(units_ordered) FROM analytics.fct_wholesale WHERE year(ship_date)=2026 GROUP BY 1 ORDER BY 1"}
- {id: ws-ontime-type, topic: wholesale, question: "On-time shipping rate by account type for wholesale lines shipped in Q3 2026", sql: "SELECT a.account_type, AVG(CASE WHEN ship_date <= requested_ship_date THEN 1.0 ELSE 0 END)*100 FROM analytics.fct_wholesale w JOIN analytics.dim_account a USING (account_id) WHERE ship_date BETWEEN DATE '2026-07-01' AND DATE '2026-09-30' GROUP BY 1"}
- {id: ws-short-units, topic: wholesale, question: "How many pairs did we short wholesale accounts in 2026, meaning ordered but not shipped?", sql: "SELECT SUM(units_ordered - units_shipped) FROM analytics.fct_wholesale WHERE year(ship_date)=2026"}
- {id: ws-accounts-type, topic: wholesale, question: "How many wholesale accounts are there of each type?", sql: "SELECT account_type, COUNT(*) FROM analytics.dim_account GROUP BY 1"}
- {id: inv-latest-units, topic: inventory, question: "How many pairs are on hand right now?", sql: "SELECT SUM(on_hand_units) FROM analytics.fct_inventory WHERE snapshot_month=(SELECT MAX(snapshot_month) FROM analytics.fct_inventory)"}
- {id: inv-below, topic: inventory, question: "How many store, product and size combinations are below their reorder point in the latest snapshot?", sql: "SELECT COUNT(*) FROM analytics.fct_inventory WHERE snapshot_month=(SELECT MAX(snapshot_month) FROM analytics.fct_inventory) AND on_hand_units < reorder_point"}
- {id: inv-wos-category, topic: inventory, question: "Weeks of supply by product category right now", sql: "SELECT p.category, SUM(on_hand_units)/SUM(weekly_units_sold) FROM analytics.fct_inventory i JOIN analytics.dim_product p USING (product_id) WHERE snapshot_month=(SELECT MAX(snapshot_month) FROM analytics.fct_inventory) GROUP BY 1"}
- {id: inv-sellthrough-brand, topic: inventory, question: "Sell-through by brand in August 2026", sql: "SELECT p.brand, SUM(units_sold)*100.0/(SUM(units_sold)+SUM(on_hand_units)) FROM analytics.fct_inventory i JOIN analytics.dim_product p USING (product_id) WHERE snapshot_month=DATE '2026-08-01' GROUP BY 1"}
- {id: inv-value, topic: inventory, question: "What is the value at cost of current inventory by region?", sql: "SELECT s.region, SUM(i.on_hand_units*p.unit_cost) FROM analytics.fct_inventory i JOIN analytics.dim_product p USING (product_id) JOIN analytics.dim_store s USING (store_id) WHERE snapshot_month=(SELECT MAX(snapshot_month) FROM analytics.fct_inventory) GROUP BY 1"}
- {id: cus-segment, topic: customers, question: "How many customers are in each segment?", sql: "SELECT segment, COUNT(*) FROM analytics.dim_customer GROUP BY 1"}
- {id: cus-tier-value, topic: customers, question: "Revenue per customer by loyalty tier in 2026", sql: "SELECT c.loyalty_tier, SUM(net_revenue)/COUNT(DISTINCT customer_id) FROM analytics.fct_sales f JOIN analytics.dim_customer c USING (customer_id) WHERE year(order_date)=2026 GROUP BY 1"}
- {id: cus-active, topic: customers, question: "How many active customers bought something in Q3 2026?", sql: "SELECT COUNT(DISTINCT customer_id) FROM analytics.fct_sales WHERE order_date BETWEEN DATE '2026-07-01' AND DATE '2026-09-30'"}
- {id: cus-repeat, topic: customers, question: "What was the repeat customer rate in Q3 2026?", sql: "SELECT COUNT(*) FILTER (WHERE n >= 2)*100.0/COUNT(*) FROM (SELECT customer_id, COUNT(DISTINCT order_id) n FROM analytics.fct_sales WHERE order_date BETWEEN DATE '2026-07-01' AND DATE '2026-09-30' GROUP BY 1)"}
- {id: mkt-roas, topic: marketing, question: "Return on ad spend by marketing channel in 2026", sql: "SELECT marketing_channel, SUM(attributed_revenue)/SUM(spend) FROM analytics.fct_marketing WHERE year(week_start)=2026 GROUP BY 1"}
- {id: mkt-spend-q4, topic: marketing, question: "Total marketing spend in Q4 2025", sql: "SELECT SUM(spend) FROM analytics.fct_marketing WHERE week_start BETWEEN DATE '2025-10-01' AND DATE '2025-12-31'"}
