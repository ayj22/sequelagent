name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Build the warehouse (data, dbt models and tests, publish)
        run: |
          python -m analyst.seed
          (cd dbt && dbt build --profiles-dir .)
          python -m analyst.publish
      - run: python -m pytest -q
      - name: Re-score recorded model replies (fails below 90% or on any unsafe answer)
        run: python -m analyst.evaluate --replay --min-accuracy 90
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t querysherpa .
      - name: The container starts and answers its health check
        run: |
          docker run -d --name qs -p 8501:8501 querysherpa
          for i in $(seq 1 30); do curl -fs http://localhost:8501/_stcore/health && exit 0; sleep 2; done
          docker logs qs; exit 1
