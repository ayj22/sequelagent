name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"      # weekly, so newly published vulnerabilities are noticed
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Secrets anywhere in the git history
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --exit-code 1
      - run: pip install --upgrade "pip>=26.2" && pip install -r requirements-dev.txt
      - name: Known vulnerabilities in dependencies
        run: pip-audit
      - name: Risky code patterns
        run: bandit -q -r analyst scripts
  test:
    runs-on: ubuntu-latest
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade "pip>=26.2" && pip install -r requirements-dev.txt
      - name: Build the warehouse (data, dbt models and tests, publish)
        run: |
          python -m analyst.seed
          (cd dbt && dbt build --profiles-dir .)
          python -m analyst.publish
      - run: python -m pytest -q
      - name: Re-score recorded model replies (fails below 90% or on any unsafe answer)
        run: python -m analyst.evaluate --replay --min-accuracy 90
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t sherpagent .
      - name: The container starts and answers its health check
        run: |
          docker run -d --name app -p 8501:8501 sherpagent
          for i in $(seq 1 30); do curl -fs http://localhost:8501/_stcore/health && exit 0; sleep 2; done
          docker logs app; exit 1
