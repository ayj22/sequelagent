# The semantic layer: what the model is told about the data, and the single definition of every metric.
data_range: "Orders run from 2025-01-01 to 2026-09-30. The latest complete month is September 2026 and the latest complete quarter is 2026 Q3."
tables:
  fct_sales:
    grain: one row per order line
    columns:
      order_item_id: line id
      order_id: order id (several lines can share it)
      order_date: DATE of the order
      channel: "'store', 'online' or 'bopis' (buy online, pick up in store)"
      store_id: store for 'store' and 'bopis' orders; NULL for online orders
      customer_id: joins dim_customer
      product_id: joins dim_product
      quantity: units on the line
      is_returned: BOOLEAN, true when the line was returned
      gross_revenue: list price times quantity, before discount and returns
      discount_amount: discount given
      net_revenue: revenue after discount; 0 for returned lines
      gross_margin: net revenue minus product cost; 0 for returned lines
  dim_store:
    grain: one row per store
    columns: {store_id: id, store_name: name, region: "'Northeast', 'South', 'Midwest' or 'West'", state: two-letter code, store_format: "'mall', 'street' or 'outlet'", opened_date: DATE}
  dim_product:
    grain: one row per product
    columns: {product_id: id, product_name: name, category: "'Footwear', 'Apparel', 'Accessories' or 'Outdoor'", subcategory: text, brand: text, list_price: price, unit_cost: cost}
  dim_customer:
    grain: one row per customer
    columns: {customer_id: id, state: two-letter code, segment: "'value', 'core' or 'premium'", loyalty_tier: "'none', 'silver' or 'gold'", signup_date: DATE}
  fct_inventory:
    grain: one row per store, product and month (a snapshot, so never add months together)
    columns: {snapshot_month: first day of the month, store_id: joins dim_store, product_id: joins dim_product, on_hand_units: units in stock, reorder_point: restock threshold}
  fct_marketing:
    grain: one row per week and marketing channel
    columns: {week_start: Monday of the week, marketing_channel: "'search', 'social', 'email', 'display' or 'affiliate'", spend: money spent, attributed_revenue: revenue attributed to the spend}
pii_columns: [full_name, email]   # never published; also refused by name so the user gets a clear reason
metrics:
  net_revenue: SUM(net_revenue)
  gross_margin: SUM(gross_margin)
  gross_margin_pct: SUM(gross_margin) / NULLIF(SUM(net_revenue), 0) * 100
  orders: COUNT(DISTINCT order_id)
  units_sold: SUM(quantity) FILTER (WHERE NOT is_returned)
  average_order_value: SUM(net_revenue) / NULLIF(COUNT(DISTINCT order_id), 0)
  return_rate_pct: AVG(CASE WHEN is_returned THEN 1.0 ELSE 0 END) * 100   # share of order lines returned
  discount_rate_pct: SUM(discount_amount) / NULLIF(SUM(gross_revenue), 0) * 100
  roas: SUM(attributed_revenue) / NULLIF(SUM(spend), 0)
  active_customers: COUNT(DISTINCT customer_id)
rules:
  - "'Revenue' or 'sales' means net_revenue unless the question says gross."
  - "'Region' belongs to stores: online orders have no region, so leave them out of any breakdown by region (inner join to dim_store)."
  - Stock questions use the latest snapshot_month unless a month is named. A product is below its reorder point when on_hand_units < reorder_point.
  - Round money and percentages to 2 decimals.
  - Return only the columns the question asks for, plus the label columns needed to read them.
examples:
  - question: What was net revenue by channel in 2025?
    sql: |
      SELECT channel, ROUND(SUM(net_revenue), 2) AS net_revenue
      FROM analytics.fct_sales
      WHERE order_date >= DATE '2025-01-01' AND order_date < DATE '2026-01-01'
      GROUP BY channel ORDER BY net_revenue DESC
